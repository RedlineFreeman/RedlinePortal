version: '3.8'

services:
  sysadmin-pro:
    build:
      context: .
      dockerfile: Dockerfile
    image: sysadmin-pro:latest
    container_name: sysadmin_pro_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
